# تشغيل محلي فقط (wrangler dev --local → workerd): الـWorker الحقيقي src/index.js بـD1 محلية؛ لا حساب Cloudflare ولا نشر ولا أسرار حقيقية.
# القيم أدناه وهمية للتطوير المحلي؛ مفتاح النموذج هنا يشير لمحاكاة محلية (LAURA_LLM_ENDPOINT) لا لمزوّد حقيقي.
name = "alyssum-platform-api-laura-local"
main = "../src/index.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "laura-local"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
PLATFORM_SECRET = "local-dev-platform-secret-0123456789"
ADMIN_TOKEN = "local-admin-token"
LAURA_LLM_KEY = "mock-key"
LAURA_WRITES = "on"   # المحاكاة المحلية تختبر الكتابة بالموافقة؛ الإنتاج الافتراضي «قراءة فقط»
LAURA_LLM_ENDPOINT = "http://127.0.0.1:8799"
LAURA_ACTOR_SECRET = "local-actor-secret-0123456789abcdef"
LAURA_TIMEOUT_MS = "1500"
# مفتاح تشفير وهمي للتطوير المحلي فقط (32 بايت معروفة): تشفير هواتف الطلبات في D1 المحلية؛ لا يُستعمل خارج هذا الملف
APP_ENCRYPTION_KEY = "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
