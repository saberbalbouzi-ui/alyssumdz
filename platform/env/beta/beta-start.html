<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>بدء تجربة Beta</title>
<style>body{font-family:system-ui,Segoe UI,Tahoma,sans-serif;background:#0f1a17;color:#e8f1ee;margin:0;padding:24px}main{max-width:560px;margin:0 auto}h1{font-size:1.4rem}.card{background:#16261f;border:1px solid #28443a;border-radius:14px;padding:18px;margin:14px 0}label{display:block;margin:.7rem 0 .25rem;font-weight:700}input{width:100%;box-sizing:border-box;padding:.65rem;border-radius:10px;border:1px solid #3a5a4e;background:#0f1a17;color:inherit;font:inherit}button{margin-top:1rem;padding:.7rem 1.2rem;border:0;border-radius:12px;background:#e2fe17;color:#1f2123;font-weight:800;cursor:pointer}code{direction:ltr;display:block;word-break:break-all;background:#0b1411;padding:.5rem;border-radius:8px;margin:.3rem 0}a{color:#9be7c4}.err{color:#ff9b9b}.ok{color:#9be7c4}small{opacity:.8}</style></head>
<body><main><h1>🧪 بدء تجربة منصة أليسوم (Beta)</h1>
<p><small>نسخة تجريبية معزولة عن الإنتاج: بيانات تجريبية قد تُمسح، دفع Sandbox فقط، لا رسائل ولا شركات توصيل حقيقية.</small></p>
<div class="card"><b>1) أنشئ متجراً تجريبياً</b><form id="f"><label for="n">اسم المتجر</label><input id="n" required minlength="2" maxlength="120" placeholder="متجري التجريبي"><label for="i">كود الدعوة</label><input id="i" required dir="ltr" placeholder="BETA-XXXXXXXX-XXXX" autocomplete="off"><button type="submit">إنشاء المتجر</button></form><div id="r"></div></div>
<div class="card"><b>2) جرّب الواجهات</b><ul><li><a href="/p/demo/">صفحة منتج تجريبي + إنشاء طلب</a></li><li><a href="/admin.html">لوحة التحكم (دخول بحساب مدير Beta)</a> ← «الطلبات» لإدارة الطلب</li><li><a href="/">واجهة المتجر</a></li></ul></div></main>
<script>
document.getElementById("f").addEventListener("submit", function (e) {
  e.preventDefault(); var API = (typeof CONFIG !== "undefined" && CONFIG.BETA && CONFIG.BETA.api) || ""; var r = document.getElementById("r"); r.textContent = "… جارٍ الإنشاء";
  fetch(API + "/v1/beta/signup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: document.getElementById("n").value.trim(), invite: document.getElementById("i").value.trim() }) })
    .then(function (x) { return x.json().then(function (j) { return { s: x.status, j: j }; }); })
    .then(function (o) { var d = o.j && (o.j.data || o.j);
      if (o.s === 201 && d && d.key) { r.innerHTML = '<p class="ok">✅ أُنشئ المتجر رقم ' + d.tenant_id + '</p><p>مفتاح الاختبار (يظهر مرة واحدة، احفظه الآن):</p><code id="k"></code><small>وضع test: الطلبات بهذا المفتاح تُحاكى ولا تُحفظ. للطلبات الفعلية استعمل لوحة التحكم.</small>'; document.getElementById("k").textContent = d.key; }
      else { var m = (o.j && o.j.error && (o.j.error.message || o.j.error.code)) || (o.j && o.j.message) || ("خطأ " + o.s); r.innerHTML = '<p class="err"></p>'; r.firstChild.textContent = "❌ " + m; } })
    .catch(function () { r.innerHTML = '<p class="err">❌ تعذّر الاتصال بمنصة Beta</p>'; });
});
</script><script src="/assets/js/config.js"></script><script src="assets/js/beta-banner.js" defer></script></body></html>
