services:
  lighthouse:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"   # اجعل Nginx/Caddy أمامها مع HTTPS، ولا تفتحها مباشرة للإنترنت
    shm_size: "1gb"             # Chrome يحتاج ذاكرة مشتركة كافية
    mem_limit: 3g
    cpus: 2
    init: true
