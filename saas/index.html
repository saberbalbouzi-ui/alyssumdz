<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة منصة أليسوم</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314532d'/%3E%3Cpath d='M9 22l7-13 7 13' fill='none' stroke='%2386f06a' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css?v=2">
</head>
<body>
<section id="login" hidden>
  <form class="lbox" id="lf" autocomplete="on">
    <h1>لوحة منصة أليسوم</h1>
    <div class="mut sm">دخول مدير المنصة</div>
    <label class="f" for="le">البريد الإلكتروني</label>
    <input id="le" type="email" dir="ltr" autocomplete="username" required>
    <label class="f" for="lp">كلمة المرور</label>
    <input id="lp" type="password" dir="ltr" autocomplete="current-password" required>
    <div class="err" id="lerr"></div>
    <button class="btn" style="width:100%;margin-top:.4rem" id="lbtn">دخول</button>
  </form>
</section>

<div id="app" hidden>
  <aside>
    <div class="brand">منصة أليسوم<small>لوحة المزوّد</small></div>
    <button class="nv on" data-tab="home"><span>نظرة عامة</span></button>
    <button class="nv" data-tab="inbox"><span>الطلبات</span><span class="bd" id="bd-inbox" hidden>0</span></button>
    <button class="nv" data-tab="sites"><span>المواقع</span><span class="bd" id="bd-sites" hidden>0</span></button>
    <button class="nv" data-tab="customers"><span>الزبائن</span></button>
    <button class="nv" data-tab="subs"><span>الاشتراكات والإغلاق</span></button>
    <button class="nv" data-tab="api"><span>إعدادات API</span></button>
    <button class="nv" data-tab="outbox"><span>الإشعارات الصادرة</span><span class="bd" id="bd-outbox" hidden>0</span></button>
    <button class="nv" data-tab="stats"><span>التحليلات</span></button>
    <button class="nv" data-tab="rel"><span>نشر التحديثات</span></button>
    <button class="nv" data-tab="settings"><span>الإعدادات</span></button>
    <div class="spacer"></div>
    <div class="mut sm ltr" id="who" style="padding:0 .6rem"></div>
    <button class="btn g s" id="logout">تسجيل الخروج</button>
  </aside>
  <main>
    <div class="top"><h2 id="ttl"></h2><span class="live" id="live"><i></i><span>غير متصل</span></span><button class="btn g s" id="refresh">تحديث</button></div>
    <div id="view"></div>
  </main>
</div>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=1"></script>
<script src="release.js?v=1"></script>
<script src="domains-ui.js?v=1"></script>
<script src="app.js?v=4"></script>
</body>
</html>
