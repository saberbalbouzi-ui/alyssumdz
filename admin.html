<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم — أليسوم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--green:#173F35;--green2:#0F2E26;--gold:#C8A24B;--bg:#F5F2EB;--line:#E5DFD2;--red:#D64545;--ok:#1E9E6A}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);direction:rtl;color:#1C2420}
.login{max-width:400px;margin:10vh auto;background:#fff;border-radius:18px;padding:2rem;box-shadow:0 20px 50px rgba(0,0,0,.08)}
.login h1{color:var(--green);font-size:1.5rem;margin-bottom:.4rem}
.login p{color:#6B7672;font-size:.9rem;margin-bottom:1.2rem}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:.7rem .9rem;font-family:inherit;font-size:.95rem;margin-bottom:.8rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
button{cursor:pointer;border:none;font-family:inherit}
.btn{background:var(--green);color:#fff;font-weight:800;border-radius:10px;padding:.8rem;width:100%;font-size:1rem}
.tabs{display:flex;gap:.5rem;background:#fff;padding:.6rem;border-radius:14px;margin-bottom:1.2rem;flex-wrap:wrap}
.tab{flex:1;min-width:120px;padding:.7rem;border-radius:10px;font-weight:800;color:#6B7672;background:transparent}
.tab.on{background:var(--green);color:#fff}
.wrap{max-width:1150px;margin:0 auto;padding:1.2rem}
.top{display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap}
.top h1{color:var(--green);font-size:1.4rem}
.top button.logout{margin-inline-start:auto;background:var(--red);color:#fff;padding:.5rem 1.2rem;border-radius:10px;font-weight:800}
.card{background:#fff;border-radius:16px;padding:1.2rem;margin-bottom:1rem;box-shadow:0 4px 14px rgba(0,0,0,.04)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{background:var(--green);color:#fff;padding:.7rem;text-align:right;font-size:.85rem}
td{padding:.6rem .7rem;border-bottom:1px solid var(--line)}
tr:hover td{background:#FAF7F0}
.pill{padding:.2rem .7rem;border-radius:999px;font-size:.75rem;font-weight:800;white-space:nowrap}
.st-nouvelle{background:#FFF3D6;color:#8A6D1B}.st-confirmee{background:#DCEBFF;color:#1B4F8A}
.st-expediee{background:#E7D9FF;color:#5B2D8A}.st-livree{background:#D9F2E5;color:#14714B}
.st-annulee{background:#FFE0E0;color:#A32222}
.small{background:var(--green);color:#fff;border-radius:8px;padding:.35rem .8rem;font-size:.8rem;font-weight:800}
.small.warn{background:var(--red)}
.fee-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:.8rem}
.fee{border:1.5px solid var(--line);border-radius:12px;padding:.8rem;background:#fff}
.fee h4{color:var(--green);font-size:.95rem;margin-bottom:.5rem}
.fee label{font-size:.75rem;color:#6B7672}
.fee input{padding:.4rem .6rem;margin-bottom:.4rem;font-size:.9rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.stat{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.stat div{flex:1;min-width:140px;background:#fff;border-radius:14px;padding:1rem;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.stat b{display:block;font-size:1.6rem;color:var(--green)}
.stat span{color:#6B7672;font-size:.85rem}
#toast2{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:var(--green);color:#fff;padding:.7rem 1.4rem;border-radius:999px;font-weight:800;opacity:0;transition:.3s;z-index:99}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:18px;padding:1.5rem;width:min(560px,100%);max-height:88vh;overflow:auto}
.modal h3{color:var(--green);margin-bottom:1rem}
.hidden{display:none}
</style>
</head>
<body>
<div id="toast2"></div>

<!-- تسجيل الدخول -->
<div class="login" id="login-box">
  <h1>🌿 لوحة تحكم أليسوم</h1>
  <p>أدخل مفتاح الإدارة للمتابعة (نفس المفتاح في Code.gs)</p>
  <input id="login-key" type="password" placeholder="مفتاح الإدارة" onkeydown="if(event.key==='Enter')Admin.login()">
  <button class="btn" onclick="Admin.login()">دخول</button>
</div>

<!-- اللوحة -->
<div class="wrap hidden" id="app">
  <div class="top">
    <h1>🌿 لوحة تحكم أليسوم</h1>
    <button class="logout" onclick="Admin.logout()">خروج</button>
  </div>
  <div class="stat" id="stats"></div>
  <div class="tabs">
    <button class="tab on" data-t="orders" onclick="Admin.tab('orders',this)">📦 الطلبات</button>
    <button class="tab" data-t="products" onclick="Admin.tab('products',this)">🌿 المنتجات</button>
    <button class="tab" data-t="fees" onclick="Admin.tab('fees',this)">🚚 رسوم التوصيل</button>
  </div>

  <div id="tab-orders"><div class="card" style="overflow:auto"><table id="orders-table"></table></div></div>

  <div id="tab-products" class="hidden">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem">
      <b style="color:var(--green)">المنتجات (<span id="prod-count">0</span>)</b>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap">
        <button class="small" onclick="Admin.editProduct(null)">+ منتج جديد</button>
        <button class="small" style="background:var(--gold)" onclick="Admin.reload()">↻ تحديث</button>
      </div>
    </div>
    <div class="card" style="overflow:auto"><table id="products-table"></table></div>
  </div>

  <div id="tab-fees" class="hidden">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem">
      <b style="color:var(--green)">رسوم التوصيل لكل ولاية</b>
      <div style="display:flex;gap:.6rem">
        <button class="small" style="background:var(--gold)" onclick="Admin.saveAllFees()">💾 حفظ الكل</button>
        <button class="small" onclick="Admin.reload()">↻ تحديث</button>
      </div>
    </div>
    <div class="fee-grid" id="fees-grid"></div>
  </div>
</div>

<!-- نافذة منتج -->
<div class="modal-bg" id="prod-modal-bg">
  <div class="modal">
    <h3 id="prod-modal-title">منتج جديد</h3>
    <input id="f-slug" placeholder="المعرف (slug) — إنجليزي بدون مسافات">
    <input id="f-title" placeholder="اسم المنتج">
    <div class="grid2">
      <input id="f-price" type="number" placeholder="السعر (دج)">
      <input id="f-old" type="number" placeholder="السعر قبل التخفيض (اختياري)">
    </div>
    <input id="f-images" placeholder="روابط الصور (افصل بينها بفاصلة)">
    <textarea id="f-desc" rows="2" placeholder="وصف مختصر"></textarea>
    <div class="grid2">
      <select id="f-cat"></select>
      <select id="f-active"><option value="1">✅ نشط — يظهر في المتجر</option><option value="0">⛔ موقوف — مخفي</option></select>
    </div>
    <div style="display:flex;gap:.6rem;margin-top:.5rem">
      <button class="btn" onclick="Admin.saveProduct()">💾 حفظ المنتج</button>
      <button class="btn" style="background:#999" onclick="Admin.closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/wilayas.js"></script>
<script src="assets/js/api.js"></script>
<script>
const Admin = {
  key: localStorage.getItem("alyssum_admin_key") || "",
  products: [], fees: [], orders: [],

  login(){
    const k = document.getElementById("login-key").value.trim();
    if(!k){ toast("أدخل المفتاح"); return }
    this.key = k;
    localStorage.setItem("alyssum_admin_key", k);
    this.load();
  },
  logout(){ localStorage.removeItem("alyssum_admin_key"); location.reload() },
  reload(){ this.load() },

  async load(){
    if(!this.key) return;
    if(!CONFIG.API_URL){ toast("⚠️ لم يُربط الـ API بعد — أدخل رابط Apps Script في config.js"); }
    const [prods, fees, orders] = await Promise.all([
      CONFIG.API_URL ? API.get("products") : null,
      CONFIG.API_URL ? API.get("fees") : null,
      CONFIG.API_URL ? API.orders(this.key) : null,
    ]);
    this.products = (prods && prods.ok) ? prods.products : PRODUCTS;
    this.fees = (fees && fees.ok && fees.fees.length) ? fees.fees : WILAYAS;
    this.orders = (orders && orders.ok) ? orders.orders : [];
    document.getElementById("login-box").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    this.renderAll();
    toast("✓ تم التحميل");
  },

  tab(t, btn){
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    btn.classList.add("on");
    ["orders","products","fees"].forEach(x=>document.getElementById("tab-"+x).classList.toggle("hidden", x!==t));
  },

  renderAll(){ this.renderStats(); this.renderOrders(); this.renderProducts(); this.renderFees(); },

  renderStats(){
    const today = new Date().toDateString();
    const tOrders = this.orders.filter(o => new Date(o.date).toDateString() === today);
    const revenue = this.orders.filter(o=>o.status!=="annulee").reduce((s,o)=>s+(Number(o.total)||0),0);
    document.getElementById("stats").innerHTML = `
      <div><b>${this.orders.length}</b><span>إجمالي الطلبات</span></div>
      <div><b>${tOrders.length}</b><span>طلبات اليوم</span></div>
      <div><b>${revenue.toLocaleString("fr-DZ")} دج</b><span>المبيعات</span></div>
      <div><b>${this.products.filter(p=>p.active!==false).length}</b><span>منتج نشط</span></div>`;
  },

  renderOrders(){
    const el = document.getElementById("orders-table");
    if(!this.orders.length){ el.innerHTML = "<tr><td style='text-align:center;padding:2rem;color:#999'>لا توجد طلبات بعد — أو لم يُربط الـ API</td></tr>"; return }
    el.innerHTML = `<tr><th>الرقم</th><th>التاريخ</th><th>الزبون</th><th>الهاتف</th><th>الولاية</th><th>المنتجات</th><th>الإجمالي</th><th>الحالة</th><th></th></tr>` +
      this.orders.map((o,i)=>`<tr>
        <td>${o.id}</td>
        <td>${new Date(o.date).toLocaleDateString("ar-DZ")}</td>
        <td>${o.name}</td><td dir="ltr">${o.phone}</td><td>${o.wilaya||""}</td>
        <td style="max-width:260px;font-size:.8rem">${o.items}</td>
        <td><b>${(Number(o.total)||0).toLocaleString("fr-DZ")} دج</b></td>
        <td><span class="pill st-${o.status}">${o.status}</span></td>
        <td><select onchange="API.updateOrder(Admin.key,'${o.id}',this.value);Admin.orders[${i}].status=this.value;Admin.renderStats()" style="width:auto;padding:.3rem">
          ${["nouvelle","confirmee","expediee","livree","annulee"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}
        </select></td></tr>`).join("");
  },

  renderProducts(){
    document.getElementById("prod-count").textContent = this.products.length;
    document.getElementById("products-table").innerHTML =
      `<tr><th>المنتج</th><th>السعر</th><th>القسم</th><th>الحالة</th><th></th></tr>` +
      this.products.map(p=>`<tr>
        <td><b>${p.title}</b><br><small style="color:#999">${p.slug}</small></td>
        <td><b>${Number(p.price).toLocaleString("fr-DZ")} دج</b>${p.old?`<br><small style="color:#999;text-decoration:line-through">${Number(p.old).toLocaleString("fr-DZ")}</small>`:""}</td>
        <td>${p.cat||"-"}</td>
        <td>${p.active!==false?'<span class="pill st-livree">نشط</span>':'<span class="pill st-annulee">موقوف</span>'}</td>
        <td><button class="small" onclick='Admin.editProduct(${JSON.stringify(p.slug)})'>تعديل</button>
            <button class="small warn" onclick="Admin.delProduct('${p.slug}')">حذف</button></td></tr>`).join("");
    document.getElementById("f-cat").innerHTML =
      Object.entries(CATEGORIES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  },

  editProduct(slug){
    const p = slug ? this.products.find(x=>x.slug===slug) : null;
    document.getElementById("prod-modal-title").textContent = p ? "تعديل: " + p.title : "منتج جديد";
    f_slug.value = p?p.slug:""; f_slug.readOnly = !!p;
    f_title.value = p?p.title:"";
    f_price.value = p?p.price:"";
    f_old.value = p&&p.old?p.old:"";
    f_images.value = p?(p.images||[]).join(","):"";
    f_desc.value = p?(p.desc||""):"";
    f_cat.value = p?p.cat:"health";
    f_active.value = p?(p.active!==false?"1":"0"):"1";
    document.getElementById("prod-modal-bg").classList.add("open");
  },
  closeModal(){ document.getElementById("prod-modal-bg").classList.remove("open") },

  saveProduct(){
    const p = {
      slug: f_slug.value.trim(), title: f_title.value.trim(),
      price: Number(f_price.value)||0, old: f_old.value?Number(f_old.value):null,
      images: f_images.value.split(",").map(s=>s.trim()).filter(Boolean),
      desc: f_desc.value.trim(), cat: f_cat.value, active: f_active.value==="1",
    };
    if(!p.slug || !p.title || !p.price){ toast("املأ الحقول الأساسية"); return }
    API.saveProduct(this.key, p);
    const i = this.products.findIndex(x=>x.slug===p.slug);
    if(i>=0) this.products[i]=p; else this.products.push(p);
    this.closeModal(); this.renderProducts(); this.renderStats();
    toast("✓ تم حفظ المنتج (قد يستغرق دقيقة للظهور)");
  },

  delProduct(slug){
    if(!confirm("حذف المنتج «" + slug + "»؟")) return;
    API.deleteProduct(this.key, slug);
    this.products = this.products.filter(p=>p.slug!==slug);
    this.renderProducts(); this.renderStats();
    toast("✓ تم الحذف");
  },

  renderFees(){
    document.getElementById("fees-grid").innerHTML = this.fees.map(w=>`
      <div class="fee">
        <h4>${String(w.id).padStart(2,"0")} — ${w.name}</h4>
        <label>🏠 للمنزل</label>
        <input type="number" value="${w.home}" onchange="Admin.fees.find(f=>f.id==${w.id}).home=Number(this.value)">
        <label>🏢 مكتب Stop Desk</label>
        <input type="number" value="${w.stop}" onchange="Admin.fees.find(f=>f.id==${w.id}).stop=Number(this.value)">
      </div>`).join("");
  },
  saveAllFees(){
    API.saveFees(this.key, this.fees);
    toast("✓ تم حفظ رسوم التوصيل");
  },
};
function toast(t){ const el=document.getElementById("toast2"); el.textContent=t; el.style.opacity=1; setTimeout(()=>el.style.opacity=0,2500) }
if(Admin.key) Admin.load();
</script>
</body>
</html>
