name: Smart Selection Smoke Test
on:
  push:
    branches: [feature/smart-element-selection-v2]
  pull_request:
    branches: [main]
    paths:
      - 'admin.html'
      - 'scripts/pagebuilder-smart.js'
      - 'assets/js/ai-vision.js'
      - 'assets/js/ai-vision-worker.js'
      - 'scripts/smart-selection-smoke.spec.js'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check assets/js/ai-vision.js
          node --check assets/js/ai-vision-worker.js
          node --check scripts/pagebuilder-smart.js
      - name: Install Playwright
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Browser smoke
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          npx --yes playwright@1.55.0 test scripts/smart-selection-smoke.spec.js --reporter=line
