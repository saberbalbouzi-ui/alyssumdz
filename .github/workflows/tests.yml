      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-boxdesigner.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-boxprofiles.js
      - if: ${{ !cancelled() }}
