# اختبارات تلقائية عند كل دفع (لجنة الخبراء v1.89.133): لا يُنشر شيء إلى main إلا وقد نجحت هنا أو يراها صاحب المتجر حمراء.
name: tests
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  domain:
    name: اختبارات المنطق (بلا متصفح)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: فحص صياغة ملفات JavaScript
        run: |
          fail=0
          for f in assets/js/*.js scripts/pagebuilder*.js sw.js; do
            if grep -q '^import ' "$f"; then cp "$f" /tmp/mod.mjs; node --check /tmp/mod.mjs 2>/tmp/err || { echo "::error file=$f::$(head -c 300 /tmp/err)"; fail=1; }      # وحدة ES (عامل الرؤية)
            else node -e "new Function(require('fs').readFileSync('$f','utf8'))" 2>/tmp/err || { echo "::error file=$f::$(head -c 300 /tmp/err)"; fail=1; }; fi
          done
          exit $fail
      - name: admin.html مولَّد ومطابق للمصادر (E-07)
        run: |
          python3 scripts/build-admin-pb.py >/dev/null
          git diff --stat -- admin.html
          git diff --quiet -- admin.html || { echo "::error file=admin.html::admin.html غير محدَّث من المصادر — شغّل python3 scripts/build-admin-pb.py وأضفه للإيداع"; exit 1; }
      - name: الأوامر الصوتية
        run: node scripts/test-voice.js
      - name: المخزون
        run: node scripts/test-stock.js
      - name: المدفوعات
        run: node scripts/test-payments.js
      - name: جدول رسوم الشحن الموثوق (A-01)
        run: node scripts/test-shiptable.js
      - name: رسوم البلديات
        run: node scripts/test-shipsup.js
      - name: النشر التلقائي (hub)
        run: node scripts/test-hub.js
      - name: الأدوار (نموذج + اتساق الصلاحيات)
        run: node scripts/test-roles.js
      - name: التوجيه اللوجستي (نقي)
        run: node scripts/test-dispatch.js
      - name: المستودعات والمرتجعات
        run: node scripts/test-wh.js
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'openssl, pdo_sqlite, mbstring, curl' }
      - name: وحدة تجميع شركات التوصيل (PHP)
        run: |
          php scripts/test-shipping.php
          php scripts/test-carriers.php
          php scripts/test-calibration.php
          php scripts/test-ship-php.php
          php scripts/test-gateway.php
          php scripts/test-roles-php.php
          php scripts/test-webhook-php.php
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: بوابة الشحن (Worker + D1)
        run: |
          node scripts/test-toolpages.js
          node --no-warnings platform/gateway/test/gateway.test.mjs
          node --no-warnings platform/gateway/test/carriers.parity.test.mjs
          node scripts/test-shipagg.js
          for t in platform core-modules commerce-modules growth-modules carts tryon payments sms commerce commerce-strict commerce-strict-catalog sources ads adsoauth wallet agency appstore logistics digital-vault boundaries hardening; do node --no-warnings platform/api/test/$t.test.mjs; done
  ui:
    name: اختبار اللوحة في متصفح حقيقي
    runs-on: ubuntu-latest
    # كل خطوة تعمل حتى لو فشلت سابقتها (لا يحجب test-hand بقية الاختبارات) والمهمة تفشل إن فشلت أي خطوة؛ continue-on-error أُزيل بعد إصلاح الاختبارات
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'sqlite3, pdo_sqlite, mbstring' }
      - name: poppler-utils (pdfinfo/pdftoppm لاختبارات PDF)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-hand.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-saas-wallet.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-saas-wallet-e2e.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-saas-agency.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-agency-ui.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-speed.js
      - if: ${{ !cancelled() }}
