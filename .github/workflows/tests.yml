      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-appstore-dev-ui.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-digital-ui.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-kind.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-assets.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-vgen.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-vad.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-pagerater.js
      - if: ${{ !cancelled() }}
