# اختبارات تلقائية عند كل دفع (لجنة الخبراء v1.89.133): لا يُنشر شيء إلى main إلا وقد نجحت هنا أو يراها صاحب المتجر حمراء.
name: tests
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  domain:
    name: اختبارات المنطق (بلا متصفح)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: فحص صياغة ملفات JavaScript
        run: |
          fail=0
          for f in assets/js/*.js scripts/pagebuilder*.js sw.js; do
            if grep -q '^import ' "$f"; then cp "$f" /tmp/mod.mjs; node --check /tmp/mod.mjs 2>/tmp/err || { echo "::error file=$f::$(head -c 300 /tmp/err)"; fail=1; }      # وحدة ES (عامل الرؤية)
            else node -e "new Function(require('fs').readFileSync('$f','utf8'))" 2>/tmp/err || { echo "::error file=$f::$(head -c 300 /tmp/err)"; fail=1; }; fi
          done
          exit $fail
      - name: admin.html مولَّد ومطابق للمصادر (E-07)
        run: |
          python3 scripts/build-admin-pb.py >/dev/null
          git diff --stat -- admin.html
          git diff --quiet -- admin.html || { echo "::error file=admin.html::admin.html غير محدَّث من المصادر — شغّل python3 scripts/build-admin-pb.py وأضفه للإيداع"; exit 1; }
      - name: حزمة القالب نظيفة بلا تسرّب ولا انجراف (E-10)
        run: node scripts/test-template-pack.js
      - name: الأوامر الصوتية
        run: node scripts/test-voice.js
      - name: المخزون
        run: node scripts/test-stock.js
      - name: المدفوعات
        run: node scripts/test-payments.js
      - name: جدول رسوم الشحن الموثوق (A-01)
        run: node scripts/test-shiptable.js
      - name: رسوم البلديات
        run: node scripts/test-shipsup.js
      - name: النشر التلقائي (hub)
        run: node scripts/test-hub.js
      - name: الأدوار (نموذج + اتساق الصلاحيات)
        run: node scripts/test-roles.js
      - name: التوجيه اللوجستي (نقي)
        run: node scripts/test-dispatch.js
      - name: المستودعات والمرتجعات
        run: node scripts/test-wh.js
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'openssl, pdo_sqlite, mbstring, curl' }
      - name: وحدة تجميع شركات التوصيل (PHP)
        run: |
          php scripts/test-shipping.php
          php scripts/test-carriers.php
          php scripts/test-calibration.php
          php scripts/test-ship-php.php
          php scripts/test-gateway.php
          php scripts/test-roles-php.php
          php scripts/test-webhook-php.php
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: بوابة الشحن (Worker + D1)
        run: |
          node scripts/test-toolpages.js
          node --no-warnings platform/gateway/test/gateway.test.mjs
          node --no-warnings platform/gateway/test/carriers.parity.test.mjs
          node --no-warnings platform/gateway/test/beta-boot.test.mjs
          node scripts/test-shipagg.js
          for t in platform core-modules commerce-modules growth-modules carts tryon payments payments-12c payments-currency sms commerce commerce-strict commerce-strict-catalog sources ads adsoauth wallet wallet-currency deposits agency appstore logistics digital-vault boundaries hardening reservations suppliers marketplace isolation isolation-fuzz orders-concurrency-isolation orders-idempotency orders-idempotency-concurrency idempotency-claim-ownership idem-prune idem-review envguard beta-isolation beta-module migrations; do node --no-warnings platform/api/test/$t.test.mjs; done
      - name: عزل Beta عن Production (سجل البيئات، النشر، الـworkflows، بناء Beta الساكن)
        run: |
          node platform/env/sync.mjs --check
          node scripts/test-beta-deploy.js
          python3 -c "import yaml" 2>/dev/null || pip install --user pyyaml
          python3 scripts/test-workflow-policy.py
          node scripts/test-beta-build.js
          node scripts/test-beta-resources.js
      - name: Supabase Beta — حزمة SQL + حراسات + تدريب PostgreSQL محلي (ليس Supabase الحقيقي)
        run: |
          export PGBIN=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)
          echo "PGBIN=$PGBIN"; node scripts/test-supabase-beta.js
      - name: pf_idem على محرك D1 المحلي (workerd/miniflare — ليس D1 البعيد)
        run: |
          mkdir -p /tmp/mf && cd /tmp/mf && npm init -y >/dev/null
          ok=0; for i in 1 2 3; do npm i miniflare@4 >/dev/null 2>&1 && ok=1 && break; echo "::warning::فشل تثبيت miniflare (محاولة $i)"; sleep $((i*10)); done
          [ "$ok" = 1 ] || { echo "::error::تعذّر تثبيت miniflare (إخفاق بيئة لا اختبار)"; exit 1; }
          cd "$GITHUB_WORKSPACE" && MF_DIR=/tmp/mf N=20000 node platform/api/test/d1/idem-d1-local.mjs
          MF_DIR=/tmp/mf node platform/api/test/integration/d1-beta.integration.mjs --local

  ui:
    name: اختبار اللوحة في متصفح حقيقي
    # نسخة المشغّل مثبّتة صراحةً (لا ubuntu-latest المتحرّك): Playwright لا يدعم كل إصدارات Ubuntu فور صدورها، وتغيّر latest يكسر `install --with-deps` (إخفاق تثبيت Chromium قبل أي اختبار).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PLAYWRIGHT_VERSION: '1.63.0'          # نفس النسخة المُتحقَّق منها محلياً (اختبارات المتصفح تمرّ بها)
    # كل خطوة تعمل حتى لو فشلت سابقتها (لا يحجب test-hand بقية الاختبارات) والمهمة تفشل إن فشلت أي خطوة؛ continue-on-error أُزيل بعد إصلاح الاختبارات
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'sqlite3, pdo_sqlite, mbstring' }
      - name: poppler-utils (pdfinfo/pdftoppm لاختبارات PDF)
        run: |
          for i in 1 2 3; do sudo apt-get update && sudo apt-get install -y poppler-utils && break; echo "محاولة $i فشلت"; sleep $((i*10)); done
          command -v pdfinfo >/dev/null || { echo "::error::تعذّر تثبيت poppler-utils"; exit 1; }
      - name: تثبيت Playwright (حزمة npm)
        run: npm i --no-save playwright@${PLAYWRIGHT_VERSION}
      - name: ذاكرة متصفحات Playwright
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: تثبيت Chromium (بإعادة محاولة — إخفاق التثبيت يُفصل عن إخفاق الاختبارات)
        run: |
          ok=0; for i in 1 2 3; do npx playwright install chromium && ok=1 && break; echo "::warning::فشل تنزيل Chromium (محاولة $i)"; sleep $((i*15)); done
          [ "$ok" = 1 ] || { echo "::error::تعذّر تنزيل Chromium بعد 3 محاولات (إخفاق بيئة لا اختبار)"; exit 1; }
      - name: اعتماديات النظام لـChromium (بإعادة محاولة)
        run: |
          ok=0; for i in 1 2 3; do sudo env "PATH=$PATH" npx playwright install-deps chromium && ok=1 && break; echo "::warning::فشل تثبيت اعتماديات النظام (محاولة $i)"; sleep $((i*15)); done
          [ "$ok" = 1 ] || { echo "::error::تعذّر تثبيت اعتماديات النظام لـChromium (إخفاق بيئة لا اختبار)"; exit 1; }
      - name: فحص تشغيل Chromium (يُثبت سلامة التثبيت قبل الاختبارات)
        run: |
          NODE_PATH=$PWD/node_modules node -e "const {chromium}=require('playwright');(async()=>{const b=await chromium.launch({args:['--no-sandbox']});const p=await b.newPage();await p.setContent('<p>ok</p>');console.log('chromium',b.version(),'OK');await b.close()})().catch(e=>{console.error('::error::Chromium لا يعمل: '+e.message.split(String.fromCharCode(10))[0]);process.exit(1)})"
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-hand.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-saas-wallet.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-saas-wallet-e2e.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-saas-agency.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-agency-ui.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-speed.js
      - if: ${{ !cancelled() }}
        run: node scripts/test-speed-fix.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-saas-appstore.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-appstore-ui.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-appstore-dev-ui.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-digital-ui.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-kind.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-assets.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-vgen.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-vad.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-pagerater.js
      - if: ${{ !cancelled() }}
        run: node scripts/test-edition.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-edition-live.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-edition-real.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-barcode.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-pack3d.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-mockup.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-boxdesigner.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-boxprofiles.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-boxprofiles3d.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-boxstudio.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-fashion.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-tryon-shopper.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-digital-checkout.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-upsell.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-upsell-admin.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-upsell-follow.js
      - if: ${{ !cancelled() }}
        run: NODE_PATH=$PWD/node_modules node scripts/test-beta-browser.js

  spatial-os:
    name: Spatial OS (معاينة معزولة — Chromium برمجي، بلا GPU/ميكروفون حقيقي)
    # يشغّل admin-preview/spatial-os/test/ci-run.sh: NLU (73 حالة) + Viewports (11 عرضاً) + run.js + phase9 + phase10 + phase11 (ميكروفون **وهمي**) + عقود العميل (Node).
    # WebGL هنا محاكاة برمجية (SwiftShader) لا GPU حقيقي؛ لا يُختبَر هنا: phase11a (نموذج Qwen+LoRA)، GPU/ميكروفون/STT/TTS حقيقية، WebKit/Firefox، مزوّد LLM، Supabase/D1/Chargily — تبقى NOT TESTED/BLOCKED.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PLAYWRIGHT_VERSION: '1.63.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'sqlite3, pdo_sqlite, mbstring' }
      - name: تثبيت Playwright (حزمة npm)
        run: npm i --no-save playwright@${PLAYWRIGHT_VERSION}
      - name: ذاكرة متصفحات Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: تثبيت Chromium (بإعادة محاولة — إخفاق التثبيت يُفصل عن إخفاق الاختبارات)
        run: |
          ok=0; for i in 1 2 3; do npx playwright install chromium && ok=1 && break; echo "::warning::فشل تنزيل Chromium (محاولة $i)"; sleep $((i*15)); done
          [ "$ok" = 1 ] || { echo "::error::تعذّر تنزيل Chromium بعد 3 محاولات (إخفاق بيئة لا اختبار)"; exit 1; }
      - name: اعتماديات النظام لـChromium (بإعادة محاولة)
        run: |
          ok=0; for i in 1 2 3; do sudo env "PATH=$PATH" npx playwright install-deps chromium && ok=1 && break; echo "::warning::فشل تثبيت اعتماديات النظام (محاولة $i)"; sleep $((i*15)); done
          [ "$ok" = 1 ] || { echo "::error::تعذّر تثبيت اعتماديات النظام لـChromium (إخفاق بيئة لا اختبار)"; exit 1; }
      - name: فحص تشغيل Chromium
        run: |
          NODE_PATH=$PWD/node_modules node -e "const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage();await p.setContent('<p>ok</p>');console.log('Chromium',b.version());await b.close()})().catch(e=>{console.error(e);process.exit(1)})"
      - name: اختبارات Spatial OS
        run: bash admin-preview/spatial-os/test/ci-run.sh
      - name: ملخص الأعداد والنتائج
        if: ${{ !cancelled() }}
        run: |
          { echo "### Spatial OS — نتائج CI (Chromium برمجي؛ ليس GPU/ميكروفون/WebKit/Firefox حقيقياً)"; echo; echo "| الاختبار | rc | ناجح | فاشل | ثوانٍ |"; echo "|---|---|---|---|---|"
            [ -f spatial-logs/summary.tsv ] && awk -F'\t' '{printf "| %s | %s | %s | %s | %s |\n",$1,$2,$3,$4,$5}' spatial-logs/summary.tsv
            echo; echo "**NOT TESTED / BLOCKED في CI:** phase11a (نموذج محلي)، GPU حقيقي، ميكروفون/STT/TTS حقيقي، WebKit/Firefox، مزوّد LLM حقيقي، Supabase/D1/Chargily الحقيقية."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: سجلات الاختبارات (للتشخيص)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: spatial-os-logs
          path: spatial-logs/
          retention-days: 14
