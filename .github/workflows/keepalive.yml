# يمنع إيقاف مشروع Supabase المجاني بعد أسبوع دون نشاط (للمتاجر الهادئة). يستعمل الرابط والمفتاح العام من config.js.
name: supabase-keepalive
on:
  schedule: [{ cron: "17 5 */3 * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' assets/js/config.js || true)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' assets/js/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase غير مهيّأ — لا شيء للتنفيذ"; exit 0; fi
          curl -fsS -m 30 -X POST "$URL/rest/v1/rpc/is_admin" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
