# نسخة احتياطية أسبوعية مشفَّرة لطلبات المتجر وإعداداته (لجنة الخبراء v1.89.133).
# يلزم سرّان في المستودع: SUPABASE_SERVICE_KEY (موجود لنشر المواقع) و BACKUP_PASSPHRASE (كلمة سرّ تختارها أنت وتحتفظ بها؛ بدونها لا تُفكّ النسخة).
# المستودع عام، لذلك لا يُرفع أي ملف غير مشفَّر. النسخة تُحفظ 30 يوماً ضمن «Artifacts» لهذا التشغيل.
name: backup
on:
  schedule: [{ cron: '17 3 * * 1' }]
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: تصدير وتشفير
        env:
          SVC: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
          URL: https://qvdaiundlkfbmjlummni.supabase.co
        run: |
          [ -n "$SVC" ] && [ -n "$PASS" ] || { echo "::warning::السرّان SUPABASE_SERVICE_KEY و BACKUP_PASSPHRASE غير مضبوطين — لم تُؤخذ نسخة"; exit 0; }
          mkdir out
          for t in orders admin_kv; do
            curl -fsS -H "apikey: $SVC" -H "Authorization: Bearer $SVC" "$URL/rest/v1/$t?select=*" -o out/$t.json || { echo "::error::فشل تصدير $t"; exit 1; }
          done
          tar czf backup.tgz -C out . && gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o backup-$(date +%F).tgz.gpg backup.tgz
          rm -rf out backup.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: backup-encrypted
          path: backup-*.tgz.gpg
          retention-days: 30
          if-no-files-found: ignore
