# يعيد توليد sitemap.xml وrobots.txt ووسوم SEO وتحويلات الروابط القديمة تلقائياً عند أي تعديل في المنتجات أو redirects.json
name: seo-refresh
on:
  push:
    branches: [main]
    paths: ["assets/js/data.js", "redirects.json", "scripts/seo.py", "scripts/gen-order-embeds.py", "assets/js/config.js", "assets/data/seo.json", "assets/data/blog.json", "scripts/gen-blog.py", "assets/pages/index.json", "p/*/index.html", "lp/*/index.html"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gen-blog.py
      - run: python3 scripts/gen-order-embeds.py
      - run: python3 scripts/seo.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "لا تغييرات"; exit 0; }
          git commit -m "تحديث SEO تلقائي (sitemap والروابط النظيفة)"; for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
