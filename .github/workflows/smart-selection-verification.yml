name: Smart Selection Verification
on:
  push:
    branches: [feature/smart-element-selection-v3]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check assets/js/ai-vision.js
          node --check assets/js/ai-vision-worker.js
          node --check scripts/pagebuilder-smart.js
      - name: Browser
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium
          mkdir -p .smoke
          printf '%s' 'const { test, expect } = require('"'"'@playwright/test'"'"');

test('"'"'smart selection UI loads cleanly'"'"', async ({ page }) => {
  const errors = [];
  page.on('"'"'pageerror'"'"', e => errors.push(String(e)));
  page.on('"'"'console'"'"', m => { if (m.type() === '"'"'error'"'"') errors.push(m.text()); });
  await page.goto('"'"'http://127.0.0.1:4173/admin.html'"'"', { waitUntil: '"'"'domcontentloaded'"'"', timeout: 60000 });
  await page.waitForTimeout(5000);
  await expect(page.getByText('"'"'التقاط العناصر'"'"', { exact: true }).first()).toBeVisible({ timeout: 30000 });
  const state = await page.evaluate(() => ({
    smart: typeof PBSmart !== '"'"'undefined'"'"',
    vision: typeof AIVision !== '"'"'undefined'"'"',
    refineSource: document.documentElement.innerHTML.includes('"'"'pbs-refine'"'"') && document.documentElement.innerHTML.includes('"'"'↶ تراجع'"'"')
  }));
  expect(state.smart).toBeTruthy();
  expect(state.vision).toBeTruthy();
  expect(state.refineSource).toBeTruthy();
  expect(errors, errors.join('"'"' | '"'"')).toEqual([]);
});
' > .smoke/smart-selection.spec.js
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          npx --yes -p @playwright/test@1.55.0 playwright test .smoke/smart-selection.spec.js --reporter=line
