# يعرض صفحة ويب بمتصفح كامل (Chromium) بجافاسكربتها ويحفظ نسخة جامدة في assets/clone/<id>.html؛ تقرؤها لوحة «نسخ قالب» ثم تحذفها.
name: clone-page
on:
  workflow_dispatch:
    inputs:
      url: { description: "رابط الصفحة (http/https)", required: true }
      width: { description: "عرض المتصفح بالبكسل", required: false, default: "1280" }
      id: { description: "معرّف النتيجة", required: true }
permissions:
  contents: write
concurrency: { group: clone-page, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Playwright
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Render
        env: { CLONE_URL: "${{ inputs.url }}", CLONE_W: "${{ inputs.width }}", CLONE_ID: "${{ inputs.id }}" }
        run: node scripts/clone-render.js
      - name: Commit
        env: { CLONE_ID: "${{ inputs.id }}" }
        run: |
          git config user.name "clone-bot"; git config user.email "clone-bot@users.noreply.github.com"
          git add assets/clone
          git commit -m "clone render $CLONE_ID" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((i*3)); done
          exit 1
